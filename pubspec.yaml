name: elegant_loading_overlay
description: >-
  Beautiful, customizable loading overlay for Flutter with a one-line API,
  11 built-in loaders, progress, blur, theming and scoped overlays.
version: 0.0.4
repository: https://github.com/nisargratani/elegant_loading_overlay
issue_tracker: https://github.com/nisargratani/elegant_loading_overlay/issues
topics:
  - loading
  - overlay
  - spinner
  - progress
  - ui

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # A range so contributors on older SDKs (down to Flutter 3.22) can
  # resolve dev dependencies; newer SDKs get flutter_lints 6.
  flutter_lints: '>=4.0.0 <7.0.0'
  leak_tracker_flutter_testing: ^3.0.3

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:
